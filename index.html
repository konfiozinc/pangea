<!DOCTYPE html>
<html lang="es" data-booting>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PANGEA · Coordinación real, también sin conexión</title>

  <meta name="description" content="Herramientas de coordinación para donde no llega la red: un puesto de salud a cuatro horas del hospital, un comité de agua, una escuela rural, una brigada de rescate. Traducción, emparejamiento entre problemas y capacidades, verificación por consenso, archivo del conocimiento y alertas que viajan sin internet. Sin servidores, sin cuentas y sin rastreo.">
  <meta name="author" content="PANGEA Collective">
  <meta name="theme-color" content="#FAFBFF">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="PANGEA">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index, follow">

  <!-- Sin rastreadores, sin analítica de terceros, sin cuentas. -->
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(self), camera=(self), interest-cohort=()">

  <!-- Open Graph / compartir -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PANGEA · Coordinación real, también sin conexión">
  <meta property="og:description" content="Para comunidades donde una llamada no llega. Funciona sin servidores, sin cuentas y sin conexión: las alertas viajan como archivo firmado por USB, Bluetooth, radio o mensaje de texto.">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PANGEA">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Tipografía auto-alojada: cero peticiones a terceros (css/fonts.css lo
       genera tools/build-assets.mjs). Si no existe, el sistema provee la
       reserva declarada en css/base.css y nada se rompe. -->
  <link rel="stylesheet" href="css/fonts.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">

  <!-- Bibliotecas opcionales: si no cargan (por ejemplo, sin conexión la
       primera vez), cada módulo degrada con elegancia a su modo local. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" media="print" onload="this.media='all'">

  <style>
    /* Arranque: evita el destello de contenido sin estilo antes de que
       el CSS crítico esté aplicado. Se retira cuando la app está lista. */
    html[data-booting] body { overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; gap: 1.5rem;
      background: #FAFBFF; color: #0B1220;
      font-family: 'Inter', system-ui, sans-serif;
      transition: opacity .45s ease, visibility .45s ease;
    }
    /* La pantalla de arranque es una CORTINA, no un fondo: si no se retira,
     * la aplicación entera queda detrás de una capa opaca. Este es el único
     * punto del proyecto donde un olvido deja la interfaz invisible sin
     * producir un solo error, así que la regla vive junto al propio elemento
     * y no depende de que JavaScript se acuerde de quitarlo. */
    html:not([data-booting]) #boot { opacity: 0; visibility: hidden; pointer-events: none; }
    html[data-theme='dark'] #boot, html:not([data-theme]) #boot { background: #0A0E1A; color: #EAF0FF; }
    @media (prefers-color-scheme: light) { html:not([data-theme]) #boot { background: #FAFBFF; color: #0B1220; } }
    #boot .mark {
      width: 76px; height: 76px; border-radius: 22px;
      background: linear-gradient(115deg, #6366F1, #8B5CF6 26%, #06B6D4 62%, #10B981);
      display: grid; place-items: center;
      box-shadow: 0 18px 50px -18px rgba(99,102,241,.85);
      animation: boot-pulse 2.4s cubic-bezier(.22,.61,.36,1) infinite;
    }
    #boot .word { font-size: 1.6rem; font-weight: 800; letter-spacing: .22em; }
    #boot .line { font-size: .78rem; opacity: .62; max-width: 30ch; text-align: center; line-height: 1.5; }
    #boot .bar { width: 148px; height: 3px; border-radius: 99px; background: rgba(127,140,170,.28); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
      background: linear-gradient(115deg, #6366F1, #06B6D4, #10B981); animation: boot-slide 1.3s cubic-bezier(.22,.61,.36,1) infinite; }
    @keyframes boot-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(370%); } }
    @media (prefers-reduced-motion: reduce) { #boot .mark, #boot .bar i { animation: none; } }
    .noscript { max-width: 62ch; margin: 12vh auto; padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.65; }
  </style>
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Ir al contenido principal</a>

  <!-- Pantalla de arranque -->
  <div id="boot" role="status" aria-live="polite">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3.4 9h17.2M3.4 15h17.2M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9c2.5-2.6 3.8-5.6 3.8-9S14.5 5.6 12 3Z"></path>
      </svg>
    </div>
    <div class="word">PANGEA</div>
    <div class="bar"><i></i></div>
    <div class="line" data-i18n="app.loading">Iniciando el tejido cognitivo…</div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>PANGEA necesita JavaScript</h1>
      <p>Toda la inteligencia de PANGEA —el motor de emparejamiento, la
      verificación por consenso, la traducción, las firmas criptográficas—
      se ejecuta dentro de tu navegador, en tu propio dispositivo. Sin
      JavaScript no hay nada que ejecutar, y ese es justamente el precio de
      que nadie más tenga que ejecutarlo por ti.</p>
      <p><strong>PANGEA no necesita servidores, pero sí necesita tu navegador.</strong>
      Actívalo y vuelve a cargar la página.</p>
    </div>
  </noscript>

  <!-- ===================== ARMAZÓN DE LA APLICACIÓN ====================== -->
  <div class="app" id="app">
    <!-- Barra lateral: colapsable en escritorio, cajón en móvil -->
    <aside class="app-sidebar" id="sidebar" aria-label="PANGEA"></aside>

    <!-- Cabecera contextual -->
    <header class="app-topbar" id="topbar"></header>

    <!-- Contenido de la vista activa -->
    <main class="app-main" id="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <!-- Navegación inferior (móvil) -->
  <nav class="app-bottomnav" id="bottomnav" aria-label="Navegación principal"></nav>

  <!-- Velo del cajón lateral -->
  <button class="drawer-scrim" id="drawer-scrim" aria-label="Cerrar menú" tabindex="-1"></button>

  <!-- Notificaciones -->
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- ============================ SCRIPTS =============================== -->
  <!-- Bibliotecas opcionales desde CDN. Cada módulo comprueba su existencia
       antes de usarlas, de modo que su ausencia nunca rompe la aplicación. -->
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.js" crossorigin="anonymous"></script>

  <!-- Arranque de la PWA. El registro del Service Worker se hace aparte para
       que la app siga funcionando aunque el navegador no lo soporte. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js', { scope: './' }).then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', function () {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'SW_UPDATED_CHECK' });
              }
            });
          });
        }).catch(function (err) {
          console.warn('[pangea] Service Worker no registrado:', err && err.message);
        });
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
